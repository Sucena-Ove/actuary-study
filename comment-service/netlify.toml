[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--ignore-scripts"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@waline/vercel", "pg", "serverless-http"]
  # MARKDOWN_TEX is disabled in the handler. MathJax's fonts/engines are never
  # imported on this deployment; excluding them keeps Lambda below 250 MiB.
  # Keep all database adapters: Waline's loader requires them at startup.
  included_files = ["question-ids.json", "!node_modules/@mathjax/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"

